name: Тест Телеграм-каналу (тільки зберігає сторінку)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p debug
          curl -sSL -A "Mozilla/5.0" -o debug/tg.html -w "tg %{http_code} %{size_download}\n" "https://t.me/s/orendakvartyr_ua" > debug/status.txt
          cat debug/status.txt
          git config user.name "kvartyry-bot"
          git config user.email "bot@users.noreply.github.com"
          git add debug && git commit -m "debug tg" && git pull --rebase && git push
