name: Перевірка квартир

on:
  schedule:
    - cron: "*/30 5-21 * * *"   # кожні 30 хв з 07:00 до 23:30 за Києвом (UTC+2)
  workflow_dispatch:            # кнопка «Run workflow» для ручного запуску

permissions:
  contents: write

concurrency:
  group: kvartyry
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python bot.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      - name: Зберегти, що вже бачили
        if: always()
        run: |
          git config user.name "kvartyry-bot"
          git config user.email "bot@users.noreply.github.com"
          touch status.json
          git add seen.json status.json
          git diff --cached --quiet || git commit -m "seen update"
          git push
